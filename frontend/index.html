<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F6F9" />
    <script>
      // Applied before first paint so switching themes never flashes the
      // previous one on reload. Mirrors the logic in src/hooks/useTheme.js.
      (function () {
        try {
          var stored = localStorage.getItem('railopt-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'light'
          document.documentElement.classList.add(theme)
          document.documentElement.style.colorScheme = theme
        } catch (e) {
          document.documentElement.classList.add('light')
        }
      })()
    </script>
    <meta
      name="description"
      content="RailOpt plans maintenance blocks across track, signalling and traction on one shared scale of urgency, so corridors close once instead of three times."
    />
    <title>RailOpt — one block plan for three departments</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
